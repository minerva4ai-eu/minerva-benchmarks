name: torchrun

parallelism_name: "" # Will be filled in during composing time
parallelism:
  none: { min_gpus: 0, max_gpus: 1 }
  ddp: { min_gpus: 2 }
  fsdp: { min_gpus: 2 }

scripts:
  run: scripts/torchrun_common/run-${framework.parallelism_name}.sh
  finetune: scripts/torchrun_common/finetune-${framework.parallelism_name}.py

datasets_allowed:
  - alpaca
  - squadv2
