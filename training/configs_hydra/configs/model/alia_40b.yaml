defaults:
  - base_training
  - _self_

name: alia_40b # MUST BE same as the filename
path: /path/to/alia_40b
# architecture dims — used by memory rule
total_params_billions: 40.4
architecture_type: dense
num_layers:           48
hidden_dim:           8192
num_attention_heads:  64
num_kv_heads:          8        # GQA — 8 query heads share each KV head
head_dim:             128       # hidden_dim / num_attention_heads = 8192 / 64
# attention
attention_type:       gqa       # grouped query attention, Flash Attention
# tokenizer
vocab_size:           256000
tokenizer_type:       bpe       # BSC's own multilingual tokenizer (35 European languages + code)
# GPU requirements — constraint metadata
max_gpus_scale: 32
frameworks_supported:
  - torchrun-cuda121
  - torchrun-cuda128
  - torchrun-cuda130
  - accelerate-cuda121
  - accelerate-cuda128
  - accelerate-cuda130
  - deepspeed-cuda121
  - deepspeed-cuda128
  - deepspeed-cuda130
  - deepspeed-accelerate-cuda121
  - deepspeed-accelerate-cuda128
  - deepspeed-accelerate-cuda130
parallelism_supported:
  - fsdp
  #- zero2
  - zero3
      