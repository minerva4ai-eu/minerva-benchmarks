defaults:
  - base_training
  - _self_

name: llama3_70b # MUST BE same as the filename
path: ${oc.env:MODEL_LLAMA3_70B_PATH}

# transformer dims
total_params_billions: 70.6      # Llama 2 was ~68.9B
architecture_type: dense
num_layers:           80         # Llama 2 was also 80
hidden_dim:           8192       # Llama 2 was also 8192
ffn_intermediate_dim: 28672      # Llama 2 was also 28672
num_attention_heads:  64         # Llama 2 was also 64
num_kv_heads:         8          # GQA — 8:1 ratio (Llama 2 was also 8)
head_dim:             128        # 8192 / 64

# attention
attention_type:       gqa


max_gpus_scale: 64
frameworks_supported:
  - torchrun-cuda128
  - torchrun-cuda130
  - accelerate-cuda128
  - accelerate-cuda130
  - deepspeed-cuda128
  - deepspeed-cuda130
  - megatron-nemo-2509
parallelism_supported:
  - fsdp
  - zero3
megatron_parallelism_supported:
  - tp 
  - pp
  - dp
megatron_parallelism_allowed:
  tp: ["${arch.node.gpus_per_node}"]   # allowed TP sizes; here one full node
