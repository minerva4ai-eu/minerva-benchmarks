defaults:
  - base_training
  - _self_

name: mistral_7b # MUST BE same as the filename
path: ${oc.env:MODEL_MISTRAL_7B_PATH}


# transformer dims
total_params_billions: 7.24
architecture_type: dense
num_layers:           32
hidden_dim:           4096
ffn_intermediate_dim: 14336
num_attention_heads:  32
num_kv_heads:         8        # GQA — same ratio as Llama 3
head_dim:             128      # 4096 / 32

# attention
attention_type:       gqa

# GPU requirements — constraint metadata
#min_gpus: 1
max_gpus_scale: 16
frameworks_supported:
  - torchrun-cuda128
  - torchrun-cuda130
  - accelerate-cuda128
  - accelerate-cuda130
  - deepspeed-cuda128
  - deepspeed-cuda130
parallelism_supported:
  - fsdp
  - zero2
  - zero3
