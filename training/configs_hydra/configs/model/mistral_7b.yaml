defaults:
  - base_training
  - _self_

name: mistral_7b # MUST BE same as the filename
path: path/to/mistral_7b

# transformer dims
total_params_billions: 7.24
architecture_type: dense
num_layers:           32
hidden_dim:           4096
ffn_intermediate_dim: 14336
num_attention_heads:  32
num_kv_heads:         8        # GQA — same ratio as Llama 3
head_dim:             128      # 4096 / 32

# attention
attention_type:       gqa
#sliding_window:       null     # v0.1 had 4096, v0.3 removes it

# positional encoding
#rope_theta:           1000000.0   # v0.3 increased from 10000 → 1M for longer context
#max_position_embeddings: 32768

# tokenizer
vocab_size:           32770       # v0.3 expanded from 32000 → 32770
tokenizer_type:       sentencepiece

# normalization
#norm_type:            rms_norm
#norm_eps:             1.0e-5
#activation_function:  silu     # SwiGLU

# GPU requirements — constraint metadata
#min_gpus: 1
max_gpus_scale: 8
frameworks_supported:
  - torchrun-cuda121
  - torchrun-cuda128
  - torchrun-cuda130
  - accelerate-cuda121
  - accelerate-cuda128
  - accelerate-cuda130
  - deepspeed-cuda121
  - deepspeed-cuda128
  - deepspeed-cuda130
  - deepspeed-accelerate-cuda121
  - deepspeed-accelerate-cuda128
  - deepspeed-accelerate-cuda130
parallelism_supported:
  - fsdp
  - zero2
  - zero3

combinations:
  batch_sizes: [4, 8]
  grad_accums: [8]