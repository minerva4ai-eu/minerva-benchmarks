frameworks_supported:
  - megatron-nemo-2509
megatron_parallelism_supported:
  - dp
  - tp
  - pp
  - cp

combinations:
  batch_sizes: [1]
  grad_accums: [8]
  steps: [25]
  precisions: 
  lr: 
  optimizer: 
  gradient_checkpointing: 
  enable_compile:
