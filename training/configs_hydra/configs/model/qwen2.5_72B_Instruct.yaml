defaults:
  - base_training
  - _self_

name: qwen2.5_72B_Instruct
path: path/to/qwen2.5_72b 
# transformer dims
total_params_billions: 72.7
architecture_type: dense
num_layers:           80
hidden_dim:           8192
ffn_intermediate_dim: 29568
num_attention_heads:  64
