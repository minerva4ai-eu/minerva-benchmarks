# @package _global_
# Machine-independent benchmark profile, merged on top of --config-name at runtime:
#   bash minerva-cli.sh run --config-name MN5-singularity --profile mistral7-deepspeed-flashattn2vs-flashattn3

selection:
  models: [mistral_7b]
  frameworks: [deepspeed-cuda130-flashattn3]
  datasets: [squadv2]

model:
  combinations:
    global_batch_sizes: [512]
    batch_sizes: [1,2]
    precisions: [bf16]
    attention_mechanisms: [flash_attn2, flash_attn3]
