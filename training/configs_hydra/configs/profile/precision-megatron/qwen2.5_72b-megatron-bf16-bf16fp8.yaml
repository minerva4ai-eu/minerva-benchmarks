# @package _global_
# Machine-independent benchmark profile, merged on top of --config-name at runtime:
#   bash minerva-cli.sh run --config-name MN5-singularity --profile qwen2.5_72b-megatron-bf16-bf16fp8

selection:
  models: [qwen2.5_72b]
  frameworks: [megatron-nemo-2509]

model:
  combinations:
    global_batch_sizes: [512]
    batch_sizes: [1]
    precisions: [bf16, bf16_fp8]
    
