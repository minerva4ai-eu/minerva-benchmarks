# @package _global_
# Machine-independent benchmark profile, merged on top of --config-name at runtime:
#   bash minerva-cli.sh run --config-name MN5-singularity --profile qwen2.5_72b-megatron-nemo-2509

selection:
  models: [qwen2.5_72b]
  frameworks: [megatron-nemo-2509]

model:
  max_gpus_scale: 64
  megatron_parallelism_supported:
    - tp
    - pp
    - dp
  megatron_parallelism_allowed:
    tp: ["${arch.node.gpus_per_node}"]
