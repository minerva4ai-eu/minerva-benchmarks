defaults:
  - base
  - _self_

# Patch fix, every Machine slurm config directly overwrited the following 4 fields
# There is a bug in configuration composition
# TODO: Fix inheritance issue from slurm/base
account: ${oc.env:SLURM_ACCOUNT}   # Must fill in
qos: ${oc.env:SLURM_QOS, ''}                      # Optional fill in
partition: ${oc.env:SLURM_PARTITION, ''}          # Optional fill in
constraint: ${oc.env:SLURM_CONSTRAINT, ''}        # Optional fill in

sbatch:
  gpus_per_node: ${arch.node.gpus_per_node}
  cpus_per_gpu: 24
  cpus_per_task: 96
  extra_args:
    - "--hint=nomultithread"
    - "--exclusive"