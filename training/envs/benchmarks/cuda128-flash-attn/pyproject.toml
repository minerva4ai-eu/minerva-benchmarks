[project]
name = "training-env-cuda128"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "setuptools",
  "accelerate",
  "bitsandbytes",
  "datasets",
  "deepspeed",
  "einops",
  "evaluate",
  "huggingface-hub",
  "hydra-core",
  "kagglehub",
  "lightning",
  "matplotlib",
  "memray",
  "numpy",
  "pandas",
  "peft",
  "ray",
  "scikit-learn",
  "scipy",
  "seaborn",
  "sentencepiece",
  "tiktoken",
  "tokenizers",
  "torch",
  "torchaudio",
  "torchvision",
  "torchao",
  "torchdata",
  "torchmetrics",
  "torchtune",
  "transformers",
  "triton",
  "trl",
  "safetensors",
  "tensorboardx",
  "rich",
  "pyyaml",
  "python-dotenv",
  "tqdm",
  "psutil",
  "prompt-toolkit2",
  "flash-attn",
  "pynvml",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "astral-cu128"
url = "https://wheels.astral.sh/simple/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
triton = { index = "pytorch-cu128" }
flash-attn = { index = "astral-cu128" }

