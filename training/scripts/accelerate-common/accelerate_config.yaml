# ============================================================================
# Accelerate FSDP Configuration
# ============================================================================
#
# This config tells Accelerate to use FSDP for distributed training.
#
# IMPORTANT: Placeholders {{...}} are replaced at runtime
# ============================================================================

compute_environment: LOCAL_MACHINE
debug: false

# Distributed configuration (replaced at runtime)
distributed_type: FSDP
num_machines: 4
num_processes: 4
machine_rank: 1

# Master node configuration (replaced at runtime)
main_process_ip: as02r4b13
main_process_port: 12345


# General settings (not DeepSpeed-specific)
use_cpu: false
downcast_bf16: "no"
same_network: true

