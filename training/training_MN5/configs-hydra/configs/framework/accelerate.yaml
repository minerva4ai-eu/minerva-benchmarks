name: accelerate

parallelism:
  none: { min_gpus: 1, max_gpus: 1 }
  ddp: { min_gpus: 2 }
  fsdp: { min_gpus: 2 }

scripts:
  run: scripts/accelerate-common/run-${parallelism}.sh
  finetune: scripts/accelerate-common/finetune-${parallelism}.py
  shared:
    - scripts/accelerate-common/gpu_monitor.py
    - scripts/accelerate-common/utils.py
    - scripts/gpu_plots.py
    - scripts/activate-env-per-supercomputer.sh
