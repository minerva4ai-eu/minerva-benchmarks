name: accelerate

parallelism_name: ""
parallelism:
  none: { min_gpus: 1, max_gpus: 1 }
  ddp: { min_gpus: 2 }
  fsdp: { min_gpus: 2 }

scripts:
  run: scripts/accelerate-common/run-${framework.parallelism_name}.sh
  finetune: scripts/accelerate-common/finetune-${framework.parallelism_name}-SFTTrainer.py
  shared: scripts/shared
  copy_files:
    - scripts/accelerate-common/gpu_monitor.py
    - scripts/accelerate-common/utils.py
    - scripts/gpu_plots.py
    - scripts/activate-env-per-supercomputer.sh
    - scripts/activate-env-variables-per-supercomputer.sh
    - scripts/activate-env-variables-per-supercomputer.sh
    - ${framework.scripts.run}
    - ${framework.scripts.finetune}
