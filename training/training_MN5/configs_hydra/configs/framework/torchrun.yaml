name: torchrun

parallelism_name: 
parallelism:
  none: { min_gpus: 1, max_gpus: 1 }
  ddp: { min_gpus: 2 }
  fsdp: { min_gpus: 2 }

scripts:
  run: scripts/torchrun-common/run-${parallelism}.sh
  finetune: scripts/torchrun-common/finetune-${parallelism}.py
  shared: scripts/shared
  copy_files:
    - scripts/torchrun-common/gpu_monitor.py
    - scripts/torchrun-common/utils.py
    - scripts/gpu_plots.py
    - scripts/activate-env-variables-per-supercomputer.sh
    - ${scripts.run}
    - ${scripts.finetune}
