[project]
name = "training-env-cuda121"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
  "setuptools==75.6.0",
  "accelerate==1.10.1",
  "bitsandbytes==0.45.0",
  "datasets==4.8.5",
  "deepspeed==0.15.4",
  "einops==0.8.0",
  "evaluate==0.4.3",
  "huggingface-hub==0.35.3",
  "hydra-core==1.3.2",
  "kagglehub==0.3.10",
  "lightning==2.5.5",
  "matplotlib==3.10.7",
  "memray==1.14.0",
  "numpy==2.4.6",
  "pandas==2.2.3",
  "peft==0.14.0",
  "ray==2.38.0",
  "scikit-learn==1.8.0",
  "scipy==1.17.1",
  "seaborn==0.13.2",
  "sentencepiece==0.2.0",
  "tiktoken==0.9.0",
  "tokenizers==0.22.1",
  "torch==2.5.1",
  "torchaudio==2.5.1",
  "torchvision==0.20.1",
  "torchao==0.9.0",
  "torchdata==0.11.0",
  "torchmetrics==1.8.2",
  "torchtune==0.6.0",
  "transformers==4.57.0",
  "triton==3.1.0",
  "trl==1.4.0",
  "safetensors==0.5.0",
  "tensorboardx==2.6.2.2",
  "rich==13.9.0",
  "pyyaml==6.0.2",
  "python-dotenv==1.1.1",
  "tqdm==4.67.1",
  "psutil==6.1.1",
  "prompt-toolkit==3.0.52",
  "flash-attn==2.8.3",
  "pynvml==13.0.1",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }
triton = { index = "pytorch-cu121" }

[tool.uv.extra-build-dependencies]
flash-attn = ["setuptools", "torch"]

[tool.uv]
no-build-isolation-package = ["flash-attn"]
