[project]
name = "slurm-cli-minimal-env"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
  #"hydra-core==1.3.2",
  #"matplotlib==3.10.7",
  #"numpy==2.4.6",
  #"pandas==2.2.3",
  #"seaborn==0.13.2",
  #"pyyaml==6.0.2",
  #"python-dotenv==1.1.1",
  #"tqdm==4.67.1",
  #"psutil==6.1.1",
  #"prompt-toolkit==3.0.52",
  "hydra-core",
  "matplotlib",
  "numpy",
  "pandas",
  "seaborn",
  "pyyaml",
  "python-dotenv",
  "tqdm",
  "psutil",
  "prompt-toolkit",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.extra-build-dependencies]
flash-attn = ["setuptools", "torch"]

[tool.uv]
no-build-isolation-package = ["flash-attn"]
